name = "bookbindass-trip-ideas"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://bookbindass.com"
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"

# Cloudflare Workers AI — inference runs on Cloudflare's own
# infrastructure via this binding. No external API key needed.
[ai]
binding = "AI"
